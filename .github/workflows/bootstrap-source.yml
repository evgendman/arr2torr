name: Bootstrap and verify v1.0.3 source

on:
  push:
    branches: [main]
    paths:
      - ".staging/importer.gz.part*.b64"
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reconstruct and verify the original source
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/importer.gz.part1.b64 .staging/importer.gz.part2.b64 .staging/importer.gz.part3.b64 > /tmp/importer.py.gz.b64
          base64 --decode /tmp/importer.py.gz.b64 > /tmp/importer.py.gz
          mkdir -p src
          gzip -dc /tmp/importer.py.gz > src/importer.py
          printf '%s  %s\n' 'cb41dfefedfd6af854f6642f79442efb2d8eb19514f582b5d278bce455178b31' 'src/importer.py' | sha256sum --check -
          chmod 0755 src/importer.py
          python3 -m py_compile src/importer.py
          python3 src/importer.py --version

      - name: Finalize repository documentation and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text, count = re.subn(
              r"\n\n> \*\*Repository publication note:\*\*.*?\n\n(?=## Why this exists)",
              "\n\n",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1 or "Repository publication note:" in text:
              raise SystemExit("Could not safely remove the temporary README publication note.")
          readme.write_text(text, encoding="utf-8")

          guide = Path("docs/INSTALLATION.md")
          text = guide.read_text(encoding="utf-8")
          replacement = """## 1. Install the program and systemd units

          From a local checkout of this repository:

              git clone https://github.com/evgendman/arr2torr.git
              cd arr2torr
              sudo ./install.sh

          The installer creates the system account `torrimport` if needed, installs the Python program under `/opt/torr-arr-importer/`, installs the systemd template service and timer, creates state/log directories and runs `systemctl daemon-reload`.

          The installer does not enable timers automatically. Configure and test an instance first.

          """
          text, count = re.subn(
              r"## 1\. Publication status and installation assets\n.*?(?=> API keys belong only)",
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1 or "not yet committed to this GitHub repository" in text:
              raise SystemExit("Could not safely update the installation guide.")
          guide.write_text(text, encoding="utf-8")
          PY

          git rm -rf .staging .github/workflows/bootstrap-source.yml
          git add src/importer.py README.md docs/INSTALLATION.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: publish verified torr-arr-importer v1.0.3 source"
          git push origin HEAD:main
